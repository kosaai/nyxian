name: Build Nyxian IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyxian-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Select and verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install pkgconf cmake libarchive dpkg openssl ninja ldid

      - name: Cache LLVM-On-iOS sources & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            LLVM-On-iOS/swift
            LLVM-On-iOS/llvm-project
            LLVM-On-iOS/build/LLVMClangSwift_iphoneos
            LLVM-On-iOS/LLVM.xcframework
            LLVM-On-iOS/CoreCompilerSupportLibs
            LLVM-On-iOS/.SwiftToolchain-iphoneos
            LLVM-On-iOS/SwiftToolchain-iphoneos
            LLVM-On-iOS/SwiftToolchain.zip
          key: llvm-ios-${{ runner.os }}-${{ hashFiles('LLVM-On-iOS/Makefile', 'LLVM-On-iOS/Scripts/build-swift-toolchain.sh') }}-${{ github.sha }}
          restore-keys: |
            llvm-ios-${{ runner.os }}-${{ hashFiles('LLVM-On-iOS/Makefile', 'LLVM-On-iOS/Scripts/build-swift-toolchain.sh') }}-

      - name: Cache Frameworks/CoreCompiler
        uses: actions/cache@v4
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: corecompiler-${{ runner.os }}-${{ hashFiles('LLVM-On-iOS/Makefile') }}-${{ github.sha }}
          restore-keys: |
            corecompiler-${{ runner.os }}-${{ hashFiles('LLVM-On-iOS/Makefile') }}-

      - name: Verify submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          if git submodule status --recursive | grep -q '^[-+]'; then
            echo "A Git submodule is missing or not at the recorded commit."
            exit 1
          fi

      - name: Build and package Nyxian
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DEPS=0 make all
          test -s Nyxian.ipa
          unzip -t Nyxian.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nyxian-unsigned-IPA-${{ github.run_number }}
          path: Nyxian.ipa
          if-no-files-found: error
          retention-days: 14
